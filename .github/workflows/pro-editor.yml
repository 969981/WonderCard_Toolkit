name: Pro Editor checks
# Push and Draft PR may target the same branch; keep only the latest build.
concurrency:
  group: pro-editor-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
on:
  push:
    branches: [feature/pro-editor-shadcn-tauri]
    paths:
      - "apps/studio/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pro-editor.yml"
  pull_request:
    paths:
      - "apps/studio/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pro-editor.yml"
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # No lockfile yet: use npm install, not npm ci. Lockfile will be committed after first working install.
      - run: npm install --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/generate_parity_vectors.py
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  windows-bundle:
    needs: frontend
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install --no-audit --no-fund
      - run: npm run tauri -- build
      - name: Verify atomic save Rust native unit tests (Windows)
        run: cargo test --manifest-path apps/studio/src-tauri/Cargo.toml --release --lib
      # Native process launch is useful smoke evidence, but not an interactive dialog test.
      - name: Windows native launch smoke
        shell: pwsh
        continue-on-error: true
        run: ./scripts/windows_native_launch_smoke.ps1
      - name: NSIS installed application launch smoke
        shell: pwsh
        run: ./scripts/windows_installed_smoke.ps1
      # A runner may be headless: diagnostic-only until GUI automation is proven reliable.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Windows native UI automation
        run: python -m pip install pywinauto==0.6.9
      - name: Installed app native Open/Save dialog E2E (best effort)
        shell: pwsh
        continue-on-error: true
        run: |
          $path = Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP "wondercard-installed-exe.txt") -Raw
          python scripts/windows_native_dialog_smoke.py --exe $path.Trim()
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: wondercard-pro-editor-windows-alpha
          path: apps/studio/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  windows-web-e2e:
    needs: frontend
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Edge UI file import/export, JSON v2 and locale smoke
        run: node scripts/windows_browser_io_smoke.mjs
