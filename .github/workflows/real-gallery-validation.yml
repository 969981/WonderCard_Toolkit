name: Real EventsGallery format cross-check
on:
  workflow_dispatch:
  push:
    branches:
      - feature/format-validation-gen4-9
    paths:
      - wondercard/**
      - scripts/validate_gallery_samples.py
      - .github/workflows/real-gallery-validation.yml
jobs:
  gallery-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run all offline regression tests
        run: python -m unittest tests.test_checksum_matrix tests.test_gen4_crypto tests.test_editor_synthetic tests.test_readonly_formats tests.test_typed_draft tests.test_wc9_checksum -v
      - name: Test selected reference cards in memory
        run: python scripts/validate_gallery_samples.py --out gallery-validation-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gallery-validation-report
          path: gallery-validation-report.json
          if-no-files-found: ignore
